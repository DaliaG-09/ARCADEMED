<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArcadeMed</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffd93b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ArcadeMed">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Plan: póster pop con tipografía de videojuego (Press Start 2P para títulos y cifras, Outfit para leer). Fondo amarillo fuerte, tarjetas blancas con borde negro y sombra dura, pegatinas rosa.
   Tipografía gruesa en mayúsculas para títulos. Una columna, pensada para celular. */
:root{
  --bg:#ffd93b; --panel:#ffffff; --panel2:#ffffff; --line:#14110f; --shade:#14110f; --ink:#14110f;
  --text:#14110f; --mut:#4f4638; --pink:#ff5fa2; --gold:var(--ink);
  --good:#008f4c; --bad:#e02a1f; --nefro:#1d5fe0; --gastro:#c85f00; --derma:#a02ee0;
  --display:"Press Start 2P", ui-monospace, monospace; --body:"Outfit", system-ui, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5}
body{min-height:100%;background:radial-gradient(rgba(20,17,15,.13) 1.6px, transparent 1.8px) 0 0/22px 22px, var(--bg)}
#app{max-width:720px;margin:0 auto;padding:22px 16px 72px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:800;line-height:1.1;text-wrap:balance;text-transform:uppercase;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.logo{font-size:56px;font-weight:800;line-height:.95;text-shadow:3px 3px 0 #fff}
.logo .six{display:inline-block;background:var(--pink);border:3px solid var(--ink);border-radius:14px;padding:0 .2em;margin-left:.15em;transform:rotate(5deg);box-shadow:4px 4px 0 var(--ink);text-shadow:none}
.sub{color:var(--ink);font-size:15px;margin:12px 0 0;font-weight:600}
.panel{background:var(--panel);border:3px solid var(--ink);border-radius:16px;padding:16px;box-shadow:6px 6px 0 var(--ink)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto}
.stack{display:flex;flex-direction:column;gap:18px}
.btn{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:10px 16px;font-weight:800;box-shadow:4px 4px 0 var(--ink);transition:transform .06s, box-shadow .06s}
.btn:hover{background:#fff6bd}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.gold{background:var(--pink);color:var(--ink)}
.btn.gold:hover{background:#ff79b3}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;text-decoration:underline;text-underline-offset:3px}
.btn.small{padding:6px 12px;font-size:14px;box-shadow:3px 3px 0 var(--ink)}
.btn.ghost.small{box-shadow:none}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.pill{display:inline-block;font-size:12px;font-weight:800;text-transform:uppercase;padding:2px 10px;border-radius:99px;border:3px solid currentColor;background:#fff}
.demo{color:var(--ink);font-size:11px;border:2px dashed var(--ink);padding:1px 7px;border-radius:6px;font-weight:800}
.lvl{font-family:var(--display);font-weight:800;font-size:14px;background:var(--ink);color:var(--bg);padding:3px 11px;border-radius:8px;text-transform:uppercase}
.segs{display:flex;gap:3px;margin-top:8px}
.segs i{flex:1;height:16px;background:#fff;border:2px solid var(--ink);border-radius:4px}
.segs i.on{background:var(--pink)}
.segs.good i.on{background:#19d27f}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;text-align:center}
.stats b{display:block;font-family:var(--display);font-weight:800;font-size:28px}
.stats span{font-size:12px;font-weight:700}
.worlds{display:grid;gap:16px}
.world{border-left-width:14px;display:flex;flex-direction:column;gap:8px}
.world h3{font-size:22px}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.act{text-align:left;display:flex;flex-direction:column;gap:3px;padding:14px}
.act b{font-family:var(--display);font-weight:800;font-size:19px;text-transform:uppercase}
.act span{color:var(--mut);font-size:13.5px;font-weight:500}
.gold span{color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:#fff;border:3px solid var(--ink);border-radius:10px;padding:6px 13px;font-weight:700;font-size:14px;box-shadow:3px 3px 0 var(--ink)}
.chip.on{background:var(--pink)}
.label{font-family:var(--display);font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 8px;display:inline-block;background:var(--ink);color:var(--bg);padding:2px 10px;border-radius:6px}
.hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.hud .grow{min-width:120px}
.hearts{display:flex;gap:4px}
.combo{font-family:var(--display);font-weight:800;font-size:22px;color:var(--ink);background:var(--pink);border:3px solid var(--ink);border-radius:10px;padding:0 8px;min-width:0}
.combo:empty{display:none}
.ctx{background:#fff3a8;border:3px solid var(--ink);border-radius:10px;padding:9px 12px;font-size:14px;margin-bottom:12px;font-weight:500}
.q{font-size:19px;font-weight:700;margin:6px 0 14px;text-wrap:pretty}
.qimg{max-width:100%;border-radius:12px;border:3px solid var(--ink);margin-bottom:12px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:10px 12px;box-shadow:4px 4px 0 var(--ink);font-weight:600}
.opt:not([disabled]):hover{background:#fff6bd}
.opt .k{font-family:var(--display);font-weight:800;font-size:15px;background:var(--ink);color:#fff;border-radius:7px;padding:1px 9px;flex:none}
.fb .miss{margin:6px 0 8px}
.opt .why{display:block;font-size:13.5px;margin-top:5px;font-weight:500}
.opt.ok{background:#aef2cd}
.opt.bad{background:#ffb8b0;animation:shake .35s}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
.fb{margin-top:18px;border-radius:12px;border:3px solid var(--ink);padding:14px;background:#f4f0e4}
.fb h3{font-size:20px;margin-bottom:8px}
.fb.ok h3{color:var(--good)} .fb.bad h3{color:var(--bad)}
.fb p{margin:6px 0}
.src{font-size:13px;color:var(--mut);font-weight:600}
.note{border-left:5px solid var(--derma);padding-left:10px;font-size:14px}
.guia{margin:10px 0;border:2px solid #2a6f97;border-radius:10px;padding:8px 12px;font-size:14px}
.guia summary{cursor:pointer;font-weight:700}
.guia p{margin:8px 0 0}
.guia .gsrc{font-size:12px;opacity:.8}
.big{font-family:var(--display);font-weight:800;font-size:68px;line-height:1;margin:8px 0;text-shadow:4px 4px 0 var(--pink)}
.res-list{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.res-item{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;box-shadow:4px 4px 0 var(--ink)}
.res-item b{color:var(--good);font-weight:800}
.card{min-height:240px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;cursor:pointer;padding:24px 18px;user-select:none}
.card .side{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.12em}
.card .txt{font-size:23px;font-weight:700;text-wrap:balance}
.card.back{background:var(--pink)}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.rate{padding:9px 4px;font-size:14px;display:flex;flex-direction:column;gap:2px;align-items:center}
.rate small{font-size:11px;color:var(--mut);font-weight:600}
textarea{width:100%;min-height:130px;background:#fff;color:var(--text);border:3px solid var(--ink);border-radius:12px;padding:10px;font:13px ui-monospace,monospace}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:800;z-index:9;max-width:90%}
.foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.logo{font-size:42px}.rates{grid-template-columns:repeat(2,1fr)}.big{font-size:52px}}

/* Ajustes para la tipografía de pixeles: un solo peso, más ancha, tamaños menores */
h1,h2,h3{font-weight:400;line-height:1.55;letter-spacing:0}
.logo{font-size:26px;font-weight:400;line-height:1.6}
.logo .six{padding:0 .2em;margin-left:.3em}
.lvl{font-weight:400;font-size:11px}
.stats b{font-weight:400;font-size:16px;line-height:1.6}
.world h3{font-size:14px}
.act b{font-weight:400;font-size:12px;line-height:1.6}
.label{font-weight:400;font-size:10px;letter-spacing:.04em;line-height:1.8}
.combo{font-weight:400;font-size:12px;padding:4px 8px}
.fb h3{font-size:13px;line-height:1.6}
.big{font-weight:400;font-size:40px;line-height:1.3;text-shadow:4px 4px 0 var(--pink)}
.opt .k{font-weight:400;font-size:11px;padding:5px 7px}
.card .side{font-weight:400;font-size:10px;letter-spacing:.06em}
.card .txt{font-size:21px}
@media (max-width:420px){.logo{font-size:19px}.big{font-size:30px}}

/* Ajustes v2: la letra de pixeles no trae Í mayúscula, los modos van en 2 columnas, textos largos de casos */
.world h3{font-family:var(--body);font-weight:800;font-size:20px;letter-spacing:0}
.actions{grid-template-columns:repeat(2,1fr)}
.card .txt{line-height:1.5}
.q{line-height:1.55}
@media (max-width:480px){.actions{grid-template-columns:1fr}}
.case{font-size:15px;font-weight:500;line-height:1.55;margin:4px 0 12px}
.rctxt{font:14px/1.5 var(--body);min-height:120px;margin-top:6px}
.mine{background:#fff;border:3px dashed var(--ink);border-radius:12px;padding:8px 12px;margin:12px 0;font-size:14px}
.mine p{margin:2px 0}
.pts{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.pt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#fff;color:var(--text);border:3px solid var(--ink);border-radius:12px;padding:9px 11px;font:600 14px/1.45 var(--body);cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.pt small{font-weight:800;opacity:.6;margin-left:4px}
.pt .box{flex:none;width:22px;height:22px;border:3px solid var(--ink);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900;background:#fff}
.pt.on{background:#d7f5c9}.pt.on .box{background:var(--good);color:#fff}
.pt.ok{background:#d7f5c9}.pt.ok .box{background:var(--good);color:#fff}
.pt.bad{background:#ffd6d6}.pt.bad .box{background:#fff;color:var(--bad)}
.pt:disabled{cursor:default}
.score{font-family:var(--display);font-size:14px;margin:10px 0 4px}
.tagrc{font-family:var(--display);font-size:9px;background:var(--ink);color:var(--bg);padding:5px 7px;border-radius:6px}
.note.comp{border-left-color:var(--derma)}
.ctx{font-size:13.5px}
.catbox{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.catbox svg{flex:none;animation:catpop .45s cubic-bezier(.3,1.6,.5,1) both}
.bubble{position:relative;border:3px solid var(--ink);border-radius:12px;background:#fff;padding:8px 12px;font-weight:800;font-size:15px;box-shadow:3px 3px 0 var(--ink)}
.bubble:before{content:'';position:absolute;left:-10px;top:50%;margin-top:-7px;border:7px solid transparent;border-right-color:var(--ink);border-left:0}
.fb.ok .bubble{color:var(--good)} .fb.bad .bubble{color:var(--bad)}
@keyframes catpop{from{transform:translateY(14px) scale(.6);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.catbox svg{animation:none}}

/* Vida arcade: portada con gatito, animaciones y confeti */
.logo .six{animation:wob 3.2s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(5deg)}50%{transform:rotate(2deg) translateY(-2px)}}
.press{font-family:var(--display);font-size:10px;margin:0 0 6px 4px;animation:blinkt 1.1s steps(2,jump-none) infinite}
@keyframes blinkt{50%{opacity:0}}
.hero{position:relative;height:210px;border:3px solid var(--ink);border-radius:16px;background:linear-gradient(#8fd8ff 0 66%,#4fcf7e 66% 100%);box-shadow:6px 6px 0 var(--ink);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.hero .ground{position:absolute;left:0;right:0;bottom:0;height:34%;border-top:4px solid var(--ink);background:repeating-linear-gradient(90deg,#3fb86d 0 16px,#4fcf7e 16px 32px)}
.pet{position:absolute;bottom:14px;transform:translateX(-50%);cursor:grab;transition:left 1.4s linear,bottom .55s cubic-bezier(.3,1.6,.5,1);z-index:3;-webkit-tap-highlight-color:transparent}
.pet svg{display:block;overflow:visible}
.pet.held{cursor:grabbing;transition:none}
.pet.held svg{transform:rotate(-7deg) scale(1.06)}
.pet.idle svg{animation:breathe 2.6s ease-in-out infinite}
.pet.party svg{animation:hop .7s ease-out infinite}
.pet.hop svg{animation:hop .5s ease-out 2}
.pet.walk svg{animation:step .28s ease-in-out infinite}
.pet.sleep svg{animation:breathe 4s ease-in-out infinite}
.pet.sleep:after{content:'Z z z';font-family:var(--display);font-size:9px;position:absolute;top:-16px;right:-8px;color:var(--ink);animation:zz 2.2s ease-in-out infinite}
@keyframes zz{0%{opacity:0;transform:translateY(6px)}40%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
@keyframes breathe{50%{transform:translateY(-2px) scaleY(1.025)}}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-22px) rotate(-3deg)}60%{transform:translateY(0) scaleY(.94)}}
@keyframes step{50%{transform:translateY(-5px)}}
.cat-ey,.cat-earl,.cat-earr,.cat-whl,.cat-whr{transform-box:fill-box;transform-origin:center}
.cat-ey{animation:blink 4.4s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}
.cat-earl{transform-origin:bottom right;animation:earl 6s infinite}
.cat-earr{transform-origin:bottom left;animation:earr 6s 2.7s infinite}
@keyframes earl{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-16deg)}96%{transform:rotate(4deg)}}
@keyframes earr{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(16deg)}96%{transform:rotate(-4deg)}}
.cat-whl{animation:whl 3.4s ease-in-out infinite}
.cat-whr{animation:whr 3.4s ease-in-out infinite}
@keyframes whl{50%{transform:translateX(-1.2px)}}
@keyframes whr{50%{transform:translateX(1.2px)}}
.pbub{position:absolute;top:10px;left:10px;max-width:68%;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:6px 10px;font-weight:800;font-size:14px;line-height:1.3;box-shadow:3px 3px 0 var(--ink);z-index:4}
.pbub.pop{animation:catpop .35s cubic-bezier(.3,1.6,.5,1) both}
.cloud{position:absolute;opacity:.95;animation:drift 46s linear infinite}
.cloud.c2{animation-duration:62s;animation-delay:-30s}
@keyframes drift{from{transform:translateX(-90px)}to{transform:translateX(760px)}}
.coin{position:absolute;width:30px;height:30px;padding:0;border:0;background:none;z-index:2;animation:bob 2.4s ease-in-out infinite}
.coin svg{display:block}
.coin.got{animation:none;opacity:0;transform:scale(1.6);transition:all .25s}
@keyframes bob{50%{transform:translateY(-7px)}}
.catbox.ok svg{animation:catpop .45s cubic-bezier(.3,1.6,.5,1) both,hop .55s ease-out .45s 2}
.catbox.party svg{animation:catpop .45s cubic-bezier(.3,1.6,.5,1) both,hop .6s ease-out .45s 4}
.catbox.bad svg{animation:catpop .45s cubic-bezier(.3,1.6,.5,1) both,shake .4s .45s 2}
.panel.shake{animation:shake .4s}
.segs.anim i.on{animation:segin .4s both;animation-delay:calc(var(--n)*35ms)}
@keyframes segin{from{transform:scaleY(.1);opacity:.2}60%{transform:scaleY(1.35)}to{transform:none;opacity:1}}
.spark{position:fixed;width:8px;height:8px;pointer-events:none;z-index:30;margin:-4px 0 0 -4px;animation:sparkout .8s ease-out forwards}
.spark.bad{animation-name:dropout;width:6px;height:9px}
@keyframes sparkout{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
@keyframes dropout{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.floatxp{position:fixed;pointer-events:none;z-index:31;font-family:var(--display);font-size:14px;color:var(--good);text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff;animation:floatup 1.1s ease-out forwards;white-space:nowrap}
.floatxp.combo{color:var(--pink)}
@keyframes floatup{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-56px);opacity:0}}
.lvlup{position:fixed;inset:0;background:rgba(20,17,15,.72);display:flex;align-items:center;justify-content:center;z-index:40;pointer-events:none;animation:fadein .25s both}
.lvbox{background:var(--bg);border:4px solid var(--ink);border-radius:18px;padding:20px 26px;text-align:center;box-shadow:8px 8px 0 #fff;animation:boxpop .55s cubic-bezier(.3,1.6,.5,1) both;max-width:88%}
.lvbox .big{margin:10px 0 4px;animation:lvpulse .7s ease-in-out 4}
@keyframes lvpulse{50%{transform:scale(1.12)}}
.lvbox .rk{font-family:var(--display);font-size:11px;margin:0 0 12px}
.lvlup.out{animation:fadeout .35s both}
@keyframes fadein{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
@keyframes boxpop{from{transform:scale(.4) rotate(-6deg);opacity:0}}
.conf{position:fixed;top:-14px;width:10px;height:10px;z-index:41;pointer-events:none;animation:confall var(--t) linear var(--d) forwards}
@keyframes confall{to{transform:translate(var(--x),105vh) rotate(540deg)}}

/* Fase 1: ajustes, monedas, sonido */
.coinct{display:inline-flex;align-items:center;gap:5px;font-family:var(--display);font-size:11px}
.coinct svg{width:18px;height:18px}
.sndbtn{position:absolute;top:8px;right:8px;z-index:5;background:#fff;border:3px solid var(--ink);border-radius:10px;padding:4px 6px;box-shadow:3px 3px 0 var(--ink);line-height:0}
.sndbtn.off .wave{display:none}
.sndbtn:not(.off) .x{display:none}
.sndbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.field{width:100%;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:10px 12px;font:600 16px var(--body)}
.chip.lock{opacity:.55}

/* Fase 2: logros, misiones, cofres */
.minis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.minis .btn{display:flex;align-items:center;gap:10px;justify-content:flex-start;font-family:var(--display);font-weight:400;font-size:11px;padding:12px}
.minis .btn svg{flex:none}
.qrow{display:flex;gap:10px;align-items:center}
.qrow .qt{font-weight:700;font-size:14px;line-height:1.35}
.qrow .segs{margin-top:4px}
.qdone{font-family:var(--display);font-size:9px;color:var(--good)}
.achgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.ach{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:12px 8px;text-align:center;box-shadow:4px 4px 0 var(--ink);font-size:13px;line-height:1.3}
.ach b{display:block;font-size:14px;margin-top:6px}
.ach.lock{background:#e9e4d2}
.ach.lock svg{filter:grayscale(1);opacity:.5}
.ach small{display:block;color:var(--mut);margin-top:3px}
.achpop{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:50;pointer-events:none;background:var(--ink);color:#fff;border:3px solid #fff;border-radius:14px;padding:8px 14px 8px 8px;display:flex;align-items:center;gap:10px;max-width:92%;box-shadow:0 6px 0 rgba(0,0,0,.3);animation:achin .5s cubic-bezier(.3,1.6,.5,1) both}
.achpop .l{font-family:var(--display);font-size:8px;color:var(--bg)}
.achpop b{display:block;font-size:15px}
.achpop.out{animation:achout .4s both}
@keyframes achin{from{transform:translate(-50%,-90px)}}
@keyframes achout{to{transform:translate(-50%,-90px);opacity:0}}
.chestov{position:fixed;inset:0;z-index:45;background:rgba(20,17,15,.78);display:flex;align-items:center;justify-content:center;animation:fadein .25s both}

<script id="banco" type="application/json">{"areas": [{"id": "nefro", "n": "Nefrología", "c": "var(--nefro)"}, {"id": "gastro", "n": "Gastroenterología", "c": "var(--gastro)"}, {"id": "derma", "n": "Dermatología", "c": "var(--derma)"}], "preguntas": [], "tarjetas": []}</script>

<script>
(function(){
const BANCO = JSON.parse(document.getElementById('banco').textContent);
const AREAS = BANCO.areas;
const KEY = 'arcade-c6-v1';
const RANKS = ['Ciclo básico','Internado','Residente','Asistente','Jefe de servicio','Catedrático'];

/* ---------- estado y guardado ---------- */
let mem = null;
function fresh(){ return {xp:0, days:[], q:{}, c:{}, custom:{preguntas:[], tarjetas:[]}, coins:0, set:{snd:false, vib:true, theme:'sol', name:''}, owned:{}, worn:{}, ach:{}, quests:null, stars:{}, bosses:{}, log:[], cnt:{ok:0, n:0, rounds:0, rcok:0, best:0, chests:0, boss:0, wins:0}}; }
function norm(o){ const f = fresh(), r = Object.assign(f, o); r.set = Object.assign(fresh().set, o && o.set); r.cnt = Object.assign(fresh().cnt, o && o.cnt); return r; }
function load(){
  try{ const r = localStorage.getItem(KEY); if(r){ const o = JSON.parse(r); return norm(o); } }catch(e){}
  return mem || fresh();
}
let S = load();
function save(){ mem = S; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- utilidades ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl = s => esc(s).replace(/\n/g, '<br>');
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const areaOf = id => AREAS.find(a => a.id === id) || AREAS[0];
const today = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
function allQ(){ const m = new Map(); BANCO.preguntas.concat(S.custom.preguntas).forEach(q => m.set(q.id, q)); return [...m.values()]; }
function allC(){ const m = new Map(); BANCO.tarjetas.concat(S.custom.tarjetas).forEach(c => m.set(c.id, c)); return [...m.values()]; }
const level = xp => 1 + Math.floor(Math.sqrt(xp/40));
const xpFor = l => 40*(l-1)*(l-1);
const isRC = q => q.tipo === 'rc';
const ptsOf = q => isRC(q) ? (q.pts || 2) : 1.25;
const fmt = n => String(Math.round(n*100)/100).replace('.', ',');
const isFallada = q => { const s = S.q[q.id]; return !!s && s.bad > 0 && s.streak < 2; };
const isDominada = q => { const s = S.q[q.id]; return !!s && s.streak >= 2; };
function dayStreak(){
  const set = new Set(S.days); let n = 0; const d = new Date();
  const f = x => x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
  if(!set.has(f(d))) d.setDate(d.getDate()-1);
  while(set.has(f(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function markDay(){ const t = today(); if(!S.days.includes(t)){ S.days.push(t); S.days = S.days.slice(-400); } }
function toast(msg){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

function px(rows, color, s){
  let r = ''; rows.forEach((row, y) => [...row].forEach((ch, x) => { if(ch === 'X') r += '<rect x="'+x+'" y="'+y+'" width="1" height="1"/>'; }));
  return '<svg viewBox="0 0 '+rows[0].length+' '+rows.length+'" width="'+(rows[0].length*s)+'" height="'+(rows.length*s)+'" fill="'+color+'" shape-rendering="crispEdges" aria-hidden="true">'+r+'</svg>';
}
const HEART = ['.XX.XX.','XXXXXXX','XXXXXXX','.XXXXX.','..XXX..','...X...'];

const CAT_COL = {K:'#0d0d0d', O:'#3a3a3a', D:'#555555', P:'#ff8fb1', W:'#4a4a4a', N:'#ff6f91', e:'#7bd88f', h:'#ffffff', B:'#4cc3ff'};

function catSvg(mood, sz, worn, halo){
  if(worn === undefined) worn = S.worn;
  const bad = mood === 'bad', sleep = mood === 'sleep';
  let o = '', eL = '', eR = '', aL = '', aR = '', wL = '', wR = '';
  CAT_HALF.forEach((h, y) => {
    const f = (h + h.split('').reverse().join('')).split('');
    if(bad){ if(y === 10 || y === 11){ f[3] = 'B'; f[16] = 'B'; } if(y === 12){ f[8] = 'K'; f[11] = 'K'; } }
    if(sleep && y >= 7 && y <= 9) f.forEach((c, i) => { if(c === 'e' || c === 'h') f[i] = y === 8 ? 'K' : 'O'; });
    const wl = (y === 9 || y === 11) ? 'KK' : '..';
    (wl + f.join('') + wl).split('').forEach((ch, x) => {
      if(!CAT_COL[ch]) return;
      const r = '<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+CAT_COL[ch]+'"/>', fx = x - 2, left = x < 12;
      if(!sleep && (ch === 'e' || ch === 'h')){ if(left) eL += r; else eR += r; }
      else if(y <= 2 || (y === 3 && (fx <= 2 || fx >= 17))){ if(left) aL += r; else aR += r; }
      else if((y === 9 || y === 11) && (x < 2 || x >= 22)){ if(left) wL += r; else wR += r; }
      else o += r;
    });
  });
  const w = 16*sz; let up = 0, dn = 0, lay = '';
  ['body','neck','extra','hat','eyes'].forEach(sl => { const it = worn && ITEMS.find(i => i.id === worn[sl]); if(it){ lay += it.d(); up = Math.max(up, it.up || 0); dn = Math.max(dn, it.dn || 0); } });
  if(halo){ lay += R(8,-2,8,1,'#ffd93b')+R(7,-1,1,1,'#ffd93b')+R(16,-1,1,1,'#ffd93b'); up = Math.max(up, 2); }
  const H = 14 + up + dn;
  return '<svg viewBox="0 '+(-up)+' 24 '+H+'" width="'+w+'" height="'+Math.round(w*H/24)+'" shape-rendering="crispEdges" role="img" aria-label="'+(bad ? 'Gatito negro triste' : sleep ? 'Gatito negro dormido' : 'Gatito negro feliz')+'">'+o+
    '<g class="cat-earl">'+aL+'</g><g class="cat-earr">'+aR+'</g><g class="cat-whl">'+wL+'</g><g class="cat-whr">'+wR+'</g><g class="cat-ey">'+eL+'</g><g class="cat-ey">'+eR+'</g>'+lay+'</svg>';
}

function sched(c, r){
  let ef = c ? c.ef : 2.5, it = c ? c.int : 0, reps = c ? c.reps : 0, due;
  if(r === 'again'){ reps = 0; it = 0; ef = Math.max(1.3, ef-0.2); due = Date.now() + 10*60000; return {ef, int:it, reps, due, label:'10 min'}; }
  if(r === 'hard'){ it = Math.max(1, Math.round((it||1)*1.2)); ef = Math.max(1.3, ef-0.15); reps++; }
  if(r === 'good'){ reps++; it = reps === 1 ? 1 : reps === 2 ? 3 : Math.round(it*ef); }
  if(r === 'easy'){ reps++; it = reps === 1 ? 3 : reps === 2 ? 6 : Math.round(it*ef*1.3); ef += 0.1; }
  due = Date.now() + it*864e5;
  return {ef, int:it, reps, due, label: it + (it === 1 ? ' día' : ' días')};
}

function sfx(n){
  if(!S.set.snd) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if(AC.state === 'suspended') AC.resume();
    const t = AC.currentTime;
    (SFX[n] || []).forEach(([f, d0, d]) => {
      const o = AC.createOscillator(), g = AC.createGain(); o.type = 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(.06, t+d0); g.gain.exponentialRampToValueAtTime(.0008, t+d0+d);
      o.connect(g); g.connect(AC.destination); o.start(t+d0); o.stop(t+d0+d+.02);
    });
  }catch(e){}
}

function parallaxInit(){

  hero.addEventListener('pointermove', e => { const r = hero.getBoundingClientRect(); set((e.clientX - r.left)/r.width*2 - 1); });
  hero.addEventListener('pointerleave', () => set(0));
  if(!PX){
    PX = true;
    window.addEventListener('deviceorientation', e => { const h = document.getElementById('hero'); if(h && e.gamma != null) h.style.setProperty('--px', Math.max(-1, Math.min(1, e.gamma/25)).toFixed(2)); });

function hashStr(x){ let h = 0; for(let i = 0; i < x.length; i++) h = (h*31 + x.charCodeAt(i)) >>> 0; return h; }
function ensureQuests(){
  const d = today(); if(S.quests && S.quests.d === d) return;
  let h = hashStr(d), pool = QPOOL.slice(), list = [];
  for(let i = 0; i < 3; i++){
    const j = h % pool.length; h = Math.floor(h/7) + 13*i + 5; const t = pool.splice(j, 1)[0];
    const g = t.g[h % t.g.length], a = t.area ? AREAS[h % AREAS.length].id : '';
    list.push({k:t.k, g, a, p:0, c:false, r:t.r, tx:t.t(g, a)});
  }
  S.quests = {d, list, chest:false}; save();
}

    q.p = Math.min(q.g, abs ? Math.max(q.p, n) : q.p + n);

  });

    if(d.moved){ pet.style.bottom = '14px'; say('¡Uf, aterrizamos!'); } else tap();
  };
  pet.addEventListener('pointerup', up); pet.addEventListener('pointercancel', up);
  hero.querySelectorAll('.coin').forEach(c => c.addEventListener('click', () => {
    if(c.classList.contains('got')) return;

function buildOpts(q){

/* ---------- lógica de rondas ---------- */
function startRound(ids, modo, redo){
  if(!ids.length){ toast('No hay preguntas con ese filtro.'); return; }
  const qs = allQ();
  sfx('start');
  V = {name:'play', sim:modo === 'sim', earn:0, max:0, hasRC:false, missMap:{}, rcFrac:0, ids, i:0, modo, lives:3, combo:0, maxCombo:0, ok:0, answeredN:0, xp:0, fails:[], answered:false, picked:null, lastXp:0, lvStart:level(S.xp), dead:false, bonus:false};
  V.opts = buildOpts(qs.find(q => q.id === ids[0])); rcReset();
  render(); window.scrollTo(0,0);
}
function filt(cfg){
  let p = allQ().filter(q => (cfg.area === 'all' || q.area === cfg.area) && (cfg.tema === 'all' || q.tema === cfg.tema));
  if(cfg.src === 'nuevas') p = p.filter(q => !S.q[q.id]);
  if(cfg.src === 'falladas') p = p.filter(isFallada);
  return p;
}
function pool(cfg){
  const base = filt(cfg), om = shuffle(base.filter(q => !isRC(q))), rc = shuffle(base.filter(isRC));
  const tipo = cfg.tipo || 'om';
  if(tipo === 'om') return cfg.n > 0 ? om.slice(0, cfg.n) : om;
  if(tipo === 'rc') return cfg.n > 0 ? rc.slice(0, cfg.n) : rc;
  if(!(cfg.n > 0)) return shuffle(om.concat(rc));
  const frac = cfg.mezcla === 'libre' ? (+cfg.pct || 50)/100 : 2/11;
  let nOm = Math.min(om.length, Math.round(cfg.n*frac)), nRc = Math.min(rc.length, cfg.n - nOm);
  nOm = Math.min(om.length, cfg.n - nRc);
  return shuffle(om.slice(0, nOm).concat(rc.slice(0, nRc)));
}
const SIM_TPL = [['nefro','rc'],['nefro','rc'],['nefro','rc','gasometria'],['nefro','rc'],['nefro','om','itu'],['gastro','rc'],['gastro','rc'],['gastro','om','pancreatitis'],['gastro','rc'],['derma','rc'],['derma','rc']];
function simIds(){
  const qs = allQ(), used = new Set(), out = [];
  const take = (f) => { const c = shuffle(qs.filter(q => !used.has(q.id) && f(q))); return c[0] || null; };
  SIM_TPL.forEach(([area, tipo, slot]) => {
    const wantRC = tipo === 'rc';
    const q = take(q => q.area === area && isRC(q) === wantRC && (!slot || q.slot === slot)) ||
              take(q => q.area === area && (!slot || q.slot === slot)) ||
              take(q => q.area === area && isRC(q) === wantRC) || take(q => q.area === area);
    if(q){ used.add(q.id); out.push(q.id); }
  });
  return out;
}
function pick(i){
  if(V.name !== 'play' || V.answered) return;
  const q = allQ().find(x => x.id === V.ids[V.i]); const o = V.opts[i]; if(!o) return;
  const lv0 = level(S.xp);
  V.answered = true; V.picked = i; V.answeredN++; V.max += 1.25; if(o.ok) V.earn += 1.25;
  const wasF = isFallada(q);
  if(V.timed) V.tPct = Math.max(0, 100 - (Date.now() - V.tStart)/200);
  const st = S.q[q.id] || {ok:0, bad:0, streak:0};
  if(o.ok){
    st.ok++; st.streak++; V.ok++; V.combo++; V.maxCombo = Math.max(V.maxCombo, V.combo);
    V.lastXp = 10 + Math.min(V.combo-1, 5)*2; V.lastCoin = V.combo >= 3 ? 3 : 2;
    V.fast = !!(V.timed && Date.now() - V.tStart < 8000); if(V.fast) V.lastXp += 3;
  } else {
    V.fast = false;
    st.bad++; st.streak = 0; V.combo = 0; V.lastXp = 0; V.lastCoin = 0; V.fails.push(q.id);
    if(V.modo === 'boss'){ V.lives--; V.lostNow = true; }
  }
  V.catMsg = o.ok ? (V.combo >= 3 ? '¡Racha de '+V.combo+'! ¡Miau-gnífico!' : catPick(CAT_OK)) : (V.modo === 'boss' && V.lives <= 0 ? 'Se acabaron las vidas... ¡a la revancha!' : catPick(CAT_BAD));
  S.q[q.id] = st; S.xp += V.lastXp; V.xp += V.lastXp; addCoins(V.lastCoin); V.coins = (V.coins || 0) + V.lastCoin; onAnswer(q, o.ok, wasF); markDay(); save(); render(); afterPick(o.ok, V.lastXp); chkLevel(lv0);
}
function next(){
  const lv0 = level(S.xp);
  const over = (V.modo === 'boss' && V.lives <= 0) || V.i + 1 >= V.ids.length;
  if(over){
    V.dead = V.modo === 'boss' && V.lives <= 0;
    const acc = V.ok / Math.max(1, V.answeredN);
    if(!V.dead && V.answeredN >= 5 && acc >= 0.8){ S.xp += 20; V.xp += 20; V.bonus = true; addCoins(5); V.coins = (V.coins || 0) + 5; save(); }
    onRoundEnd(acc); onSpecialEnd(acc); if(V.bonus && !V.loot) V.loot = lootRoll(false); save();
    const keep = V; V = Object.assign({}, keep, {name:'result'}); render(); window.scrollTo(0,0); chkLevel(lv0); return;
  }
  V.i++; V.answered = false; V.picked = null; V.tStart = Date.now(); V.timeout = false; V.lostNow = false; V.fast = false; rcReset();
  V.opts = buildOpts(allQ().find(q => q.id === V.ids[V.i]));
  render(); window.scrollTo(0,0);
}
function startCards(all){
  const cs = all ? allC() : dueCards();
  V = {name:'cards', queue:shuffle(cs.map(c => c.id)), i:0, flipped:false, done:0};
  render();
}
function rate(r){
  const lv0 = level(S.xp);
  const id = V.queue[V.i]; const nxt = sched(S.c[id], r);
  S.c[id] = {ef:nxt.ef, int:nxt.int, reps:nxt.reps, due:nxt.due};
  if(r !== 'again') S.xp += 3;
  if(r === 'again') V.queue.push(id);
  S.cnt.cards = (S.cnt.cards || 0) + 1; qProg('cards', 1); addCoins(1);
  V.done++; V.i++; V.flipped = false; markDay(); save(); render(); chkLevel(lv0);
}

/* ---------- acciones ---------- */
const OPT = {area:'all', tema:'all', n:'10', src:'todas', modo:'practica', tipo:'mixto', mezcla:'examen', pct:'50'};
const A = {
  home: () => go({name:'home'}),
  quick: () => startRound(pool({area:'all', tema:'all', n:10, src:'todas', tipo:'mixto', mezcla:'libre', pct:'80'}).map(q => q.id), 'boss'),
  sim: () => { const ids = simIds(); if(ids.length < 11){ toast('Aún no hay suficientes preguntas para un simulacro completo.'); } startRound(ids, 'sim'); },
  falladas: () => startRound(shuffle(allQ().filter(isFallada)).map(q => q.id), 'practica'),
  setup: d => go(Object.assign({name:'setup'}, OPT, {area:d.area || 'all', tema:'all'})),
  opt: d => { V[d.k] = d.v; if(d.k === 'area') V.tema = 'all'; ['area','tema','n','src','modo','tipo','mezcla','pct'].forEach(k => OPT[k] = V[k]); render(); },
  start: () => {
    const cfg = {area:V.area, tema:V.tema, n:+V.n, src:V.src, tipo:V.tipo, mezcla:V.mezcla, pct:V.pct};
    const ids = pool(cfg).map(q => q.id);
    if(V.tipo === 'mixto' && +V.n > 0){ const b = filt(cfg), r = b.filter(isRC).length; const wantRc = +V.n - Math.round(+V.n*(V.mezcla === 'libre' ? (+V.pct)/100 : 2/11)); if(r < wantRc) toast('Con este filtro solo hay '+r+' de respuesta corta; completé con opción múltiple.'); }
    startRound(ids, V.modo);
  },
  rcrev: () => { const t = document.getElementById('rctxt'); V.rc.txt = t ? t.value : ''; V.rc.rev = true; render(); },
  rctoggle: d => { if(V.answered) return; V.rc.chk[+d.i] = !V.rc.chk[+d.i]; render(); },
  rcdone: () => {
    const q = curQ(); if(!q || !isRC(q) || V.answered) return;
    const P = q.puntos || [], pts = ptsOf(q);
    const lv0 = level(S.xp);
    const earned = P.reduce((t, p, i) => t + (V.rc.chk[i] ? p.w : 0), 0), frac = pts ? earned/pts : 0, ok = frac >= 0.7;
    V.answered = true; V.answeredN++; V.earn += earned; V.max += pts; V.hasRC = true; V.rcFrac = frac;
    const wasF = isFallada(q);
    const st = S.q[q.id] || {ok:0, bad:0, streak:0};
    if(ok){ st.ok++; st.streak++; V.ok++; V.combo++; V.maxCombo = Math.max(V.maxCombo, V.combo); V.lastXp = 10 + Math.min(V.combo-1, 5)*2; V.lastCoin = V.combo >= 3 ? 4 : 3; }
    else { st.bad++; st.streak = 0; V.combo = 0; V.lastXp = Math.round(6*frac); V.lastCoin = 0; V.fails.push(q.id); if(V.modo === 'boss' && frac < 0.5){ V.lives--; V.lostNow = true; } }
    st.miss = P.map((p, i) => V.rc.chk[i] ? -1 : i).filter(i => i >= 0); V.missMap[q.id] = st.miss;
    V.catMsg = ok ? (V.combo >= 3 ? '¡Racha de '+V.combo+'! ¡Miau-gnífico!' : catPick(CAT_OK)) : catPick(CAT_BAD);
    S.q[q.id] = st; S.xp += V.lastXp; V.xp += V.lastXp; addCoins(V.lastCoin); V.coins = (V.coins || 0) + V.lastCoin; onAnswer(q, ok, wasF); markDay(); save(); render(); afterPick(ok, V.lastXp); chkLevel(lv0);
  },
  pick: d => pick(+d.i),
  next: () => next(),
  retryfails: () => startRound(shuffle(V.fails), 'practica'),
  replay: () => V.sim ? A.sim() : V.reto ? A.reto() : V.jefe ? A.jefe({a:V.jefe.a, i:temasOf(V.jefe.a).indexOf(V.jefe.t)}) : V.nivel ? A.nivel({a:V.nivel.a, i:temasOf(V.nivel.a).indexOf(V.nivel.t)}) : startRound(shuffle(V.ids), V.modo),
  cards: () => startCards(false),
  cardsall: () => startCards(true),
  flip: () => { V.flipped = !V.flipped; render(); },
  rate: d => rate(d.r),
  backup: () => go({name:'backup'}),
  ajustes: () => go({name:'ajustes'}),
  logros: () => go({name:'logros'}),
  resumen: () => go({name:'resumen'}),
  tarjeta: () => go({name:'tarjeta'}),
  sharecard: async () => {
    if(!V.cardUrl){ toast('Espera un momento, se está armando'); return; }
    try{
      const b = await (await fetch(V.cardUrl)).blob(), f = new File([b], 'arcademed-tarjeta.png', {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f], title:'ArcadeMed'}); return; }
    }catch(e){ if(e && e.name === 'AbortError') return; }
    const a = document.getElementById('cardlink'); if(a) a.click(); toast('Tu celular no comparte imágenes desde aquí, la descargué');
  },
  reforzar: d => {
    const Q = tq(d.a, d.t).sort((x, y) => (isFallada(y) ? 1 : 0) - (isFallada(x) ? 1 : 0) || Math.random() - .5);
    const out = []; let rc = 0; for(const q of Q){ if(out.length >= 10) break; if(isRC(q)){ if(rc >= 3) continue; rc++; } out.push(q.id); }
    startRound(out, 'practica');
  },
  reto: () => {
    const ids = pool({area:'all', tema:'all', n:12, src:'todas', tipo:'om', mezcla:'libre', pct:'100'}).map(q => q.id);
    if(ids.length < 6){ toast('Aún no hay suficientes preguntas de opción múltiple.'); return; }
    startRound(ids, 'boss'); if(V.name === 'play'){ V.timed = true; V.reto = true; V.tStart = Date.now(); sfx('boss'); render(); }
  },
  cont: () => { if(V.lives > 0 || (V.cont || 0) >= 2) return; const c = contCost(); if(S.coins < c){ toast('Te faltan monedas'); return; } S.coins -= c; V.cont = (V.cont || 0) + 1; V.lives = 1; V.lostNow = false; save(); sfx('buy'); next(); },
  mapa: () => go({name:'mapa', area:(V.area || V.jefe && V.jefe.a || V.nivel && V.nivel.a || AREAS[0].id)}),
  isla: d => {
    if(!S.set.maplist){ const e = document.getElementById('isl-'+d.v); if(e) e.scrollIntoView({block:'start', behavior:REDUCE() ? 'auto' : 'smooth'}); return; }
    V.area = d.v; render();
  },
  maplista: () => { S.set.maplist = !S.set.maplist; save(); render(); },
  wclose: () => closeSheet(),
  wnode: d => {
    const i = +d.i, t = temasOf(d.a)[i]; if(!t) return;
    if(!nodeOpen(d.a, i)){ toast('Consigue 1 estrella en el tema anterior para abrir este.'); sfx('bad'); return; }
    closeSheet(); sfx('click'); const key = d.a+'|'+i; S.mapcat = key; save();
    const dur = walkTo(key); setTimeout(() => { if(V.name === 'mapa') showSheet(d.a, i); }, dur + 80);
  },
  nivel: d => { const t = temasOf(d.a)[+d.i]; if(!t || !nodeOpen(d.a, +d.i)) return; const ids = nivelIds(d.a, t); startRound(ids, 'practica'); if(V.name === 'play') V.nivel = {a:d.a, t}; },
  jefe: d => { const t = temasOf(d.a)[+d.i]; if(!t || !bossOk(d.a, t) || starsOf(d.a, t) < 2) return; sfx('boss'); const ids = jefeIds(d.a, t); startRound(ids, 'boss'); if(V.name === 'play') V.jefe = {a:d.a, t}; render(); },
  tienda: () => go({name:'tienda', tab:'hat'}),
  tab: d => { V.tab = d.v; render(); },
  buy: d => {
    const it = ITEMS.find(i => i.id === d.id); if(!it || S.owned[it.id]) return;
    if(S.coins < it.p){ toast('Te faltan '+(it.p - S.coins)+' monedas'); return; }
    S.coins -= it.p; S.owned[it.id] = 1; S.cnt.buys = (S.cnt.buys || 0) + 1;
    if(it.th) S.set.theme = it.id2; else S.worn[it.slot] = it.id;
    save(); applyTheme(); sfx('buy'); buzz(30); checkAch(); render(); burstAt(document.querySelector('.shopcat .pv'), 'coin');
  },
  wear: d => {
    const it = ITEMS.find(i => i.id === d.id); if(!it || !S.owned[it.id]) return;
    if(it.th) S.set.theme = it.id2; else if(S.worn[it.slot] === it.id) delete S.worn[it.slot]; else S.worn[it.slot] = it.id;
    save(); applyTheme(); sfx('click'); render();
  },
  unwearall: () => { S.worn = {}; save(); render(); },
  qclaim: d => { ensureQuests(); const q = S.quests.list[+d.i]; if(!q || q.c || q.p < q.g) return; q.c = true; addCoins(q.r); S.cnt.qdone = (S.cnt.qdone || 0) + 1; save(); burstAt(document.querySelector('[data-act=qclaim][data-i="'+d.i+'"]'), 'coin'); checkAch(); render(); },
  qchest: () => { ensureQuests(); if(S.quests.chest || !S.quests.list.every(q => q.c)) return; S.quests.chest = true; const l = lootRoll(true); save(); openChest(l, 'COFRE DEL DÍA'); },
  resultchest: () => { if(V.loot && !V.lootOpened){ V.lootOpened = true; const l = V.loot; openChest(l, 'COFRE DE LA RONDA'); const b = document.querySelector('[data-act=resultchest]'); if(b) b.outerHTML = '<p class="src">Cofre abierto: '+esc(l.tx)+'</p>'; } },
  set: d => { if(d.k === 'theme' && !ownsTheme(d.v)){ toast('Se compra en la tienda'); return; } S.set[d.k] = (d.v === '1' ? true : d.v === '0' ? false : d.v); save(); applyTheme(); render(); if(d.k === 'snd' && S.set.snd) sfx('ok'); },
  testsnd: () => { const w = S.set.snd; S.set.snd = true; sfx('lvl'); buzz(60); S.set.snd = w; },
  sndtog: d => { S.set.snd = !S.set.snd; save(); const b = document.querySelector('.sndbtn'); if(b) b.classList.toggle('off', !S.set.snd); if(S.set.snd) sfx('ok'); },
  import: () => go({name:'import'}),
  copybk: () => { const t = document.getElementById('bk'); t.select(); try{ navigator.clipboard.writeText(t.value).then(() => toast('Código copiado'), () => toast('Selecciona el texto y cópialo a mano')); }catch(e){ toast('Selecciona el texto y cópialo a mano'); } },
  restore: () => {
    try{ const o = JSON.parse(document.getElementById('bkin').value); if(typeof o.xp !== 'number' || !o.q) throw 0; S = norm(o); save(); applyTheme(); toast('Progreso restaurado'); go({name:'home'}); }
    catch(e){ toast('Ese código no es válido'); }
  },
  doimport: () => {
    try{
      const o = JSON.parse(document.getElementById('imp').value); let np = 0, nt = 0;
      const clean = s => String(s).replace(/[^\w-]/g, '_');
      (o.preguntas || []).forEach(q => {
        if(!q.id || !q.enunciado || !AREAS.some(a => a.id === q.area)) return;
        if(q.tipo === 'rc'){ if(!Array.isArray(q.puntos) || !q.puntos.length || !(q.pts > 0)) return; }
        else if(!Array.isArray(q.opciones) || q.opciones.length < 2 || !Number.isInteger(q.correcta) || !q.opciones[q.correcta]) return;
        q.id = clean(q.id); q.tema = q.tema || 'General';
        S.custom.preguntas = S.custom.preguntas.filter(x => x.id !== q.id).concat([q]); np++;
      });
      (o.tarjetas || []).forEach(c => {
        if(!c.id || !c.f || !c.b || !AREAS.some(a => a.id === c.area)) return;
        c.id = clean(c.id); c.tema = c.tema || 'General';
        S.custom.tarjetas = S.custom.tarjetas.filter(x => x.id !== c.id).concat([c]); nt++;
      });
      save(); toast(np + ' preguntas y ' + nt + ' tarjetas cargadas'); if(np + nt) go({name:'home'});
    }catch(e){ toast('El JSON no es válido'); }
  }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if(!t || t.disabled) return;
  if(!t.classList.contains('opt') && !t.classList.contains('pt') && t.dataset.act !== 'sndtog') sfx('click');
  const f = A[t.dataset.act]; if(f) f(t.dataset);
});
document.addEventListener('change', e => { if(e.target.id === 'nm'){ S.set.name = e.target.value.trim().slice(0, 18); save(); } });
document.addEventListener('keydown', e => {
  if(e.target.tagName === 'TEXTAREA') return;
  if(V.name === 'play'){
    const i = '1234'.indexOf(e.key) >= 0 && e.key ? '1234'.indexOf(e.key) : 'abcd'.indexOf(e.key.toLowerCase());
    if(!V.answered && i >= 0 && e.key.length === 1) pick(i);
    else if(V.answered && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); next(); }
  } else if(V.name === 'cards' && V.queue[V.i]){
    if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); if(!V.flipped){ V.flipped = true; render(); } }
    else if(V.flipped && '1234'.includes(e.key) && e.key.length === 1) rate(['again','hard','good','easy']['1234'.indexOf(e.key)]);
  }
});
/* ---------- carga de preguntas desde datos/ y service worker ---------- */
async function cargarDatos(){
  try{
    const m = await (await fetch('datos/manifest.json', {cache:'no-cache'})).json();
    const ps = [], ts = [];
    for(const f of (m.archivos || [])){
      const d = await (await fetch('datos/' + f, {cache:'no-cache'})).json();
      ps.push(...(d.preguntas || [])); ts.push(...(d.tarjetas || []));
    }
    if(ps.length || ts.length){ BANCO.preguntas = ps; BANCO.tarjetas = ts; }
  }catch(e){ errorCarga = true; }
  cargando = false; if(V.name === 'home') render();
}
applyTheme();
render();
cargarDatos();
showTitle();
if('serviceWorker' in navigator){ window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }
})();
</script>
