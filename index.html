  {t:'Resina de intercambio (poliestireno sulfonato de calcio) por vía oral', fb:'La UK Kidney Association indica que ya no debe usarse de forma rutinaria. Además, no resuelve la urgencia del ECG.', fu:[0]}]},
 {q:'Los cambios del ECG mejoran tras el calcio. ¿Qué sigue?', o:[
  {t:'Insulina regular 10 U IV con glucosa, más salbutamol nebulizado 10 a 20 mg', ok:1, fb:'Es el esquema para mover el potasio hacia el interior de la célula. El salbutamol es complemento.', fu:[0,1]},
  {t:'Salbutamol nebulizado 10 a 20 mg como único tratamiento, sin insulina', fb:'No se usa solo: una parte de los pacientes no responde.', fu:[0,1]},
  {t:'Solo repetir el gluconato de calcio cada 30 minutos hasta normalizar el potasio', fb:'El calcio no saca potasio y su efecto dura 30 a 60 minutos. Hay que mover el potasio a la célula.', fu:[0,1]}]},
 {q:'Ya recibió calcio, insulina con glucosa y salbutamol. ¿Qué haces en las próximas horas?', o:[
  {t:'Vigilar la glucemia, suspender IECA y espironolactona, y planear cómo eliminar el potasio (captor oral o diálisis)', ok:1, fb:'Ni el calcio ni la insulina con glucosa eliminan potasio del cuerpo. La hipoglucemia tardía es frecuente tras la insulina, y por eso se vigila la glucemia y se da glucosa si hace falta.', fu:[0,1]},
  {t:'Alta con control ambulatorio en una semana, porque el ECG se normalizó y el potasio ya bajó', fb:'El calcio dura 30 a 60 minutos y ni él ni la insulina con glucosa eliminan potasio del cuerpo. Puede volver a subir mientras siga la causa.', fu:[0,1]}]}
 ]},
{id:'hipona', n:'Hiponatremia grave con riesgo de sobrecorrección', c:'Nefrología',
 pres:'Varón de 45 años, con consumo crónico de alcohol y desnutrición. Llega con una convulsión. Na 108 mEq/L, K 3,0 mEq/L. La hiponatremia viene de días a semanas.',
 fu:[['Hiponatremia grave y salino hipertónico (PMC10502587)','https://pmc.ncbi.nlm.nih.gov/articles/PMC10502587/'],['Panel de expertos 2013 y límites de corrección (PMC4206391)','https://pmc.ncbi.nlm.nih.gov/articles/PMC4206391'],['Límites y estrategia de rescate (PMC7015090)','https://pmc.ncbi.nlm.nih.gov/articles/PMC7015090'],['Tabla de tratamiento y desmopresina (copia de Verbalis y Sterns)','https://www.scribd.com/document/558161596/1-4904818897884021260'],['EMCrit: sobrecorrección y desmopresina','https://emcrit.org/?p=16837'],['Salino hipertónico y desmopresina, Am J Kidney Dis 2013','https://themednet.org/publications/hypertonic-saline-and-desmopressin-a-simple-strategy-for-safe-correction-of-severe-hyponatremia'],['Riesgo alto de desmielinización (guía de estudio)','https://open-exam-prep.com/study-guides/abim-critical-care/electrolyte-acid-base-endocrine-emergencies/severe-dysnatremias-management']],
 pasos:[
 {q:'¿Cómo tratas la convulsión por hiponatremia?', o:[
  {t:'Salino hipertónico al 3 % en bolo IV, repetible según respuesta, para subir el sodio 4 a 6 mEq/L', ok:1, fb:'La hiponatremia con convulsión es una emergencia. El bolo de NaCl 3 % (150 mL en 20 min en Europa, 100 mL en 10 min en EE. UU.) busca subir el sodio 4 a 6 mEq/L para bajar la presión intracraneal.', fu:[0,3]},
  {t:'Restricción hídrica a 800 mL al día y control del sodio cada 6 horas', fb:'La restricción hídrica es la primera línea en SIAD (secreción inapropiada de hormona antidiurética) cuando no hay síntomas graves. Con una convulsión se necesita salino hipertónico.', fu:[0]},
  {t:'Suero fisiológico al 0,9 % en infusión rápida hasta llevar el sodio a 135 mEq/L', fb:'Con síntomas graves se usa el bolo de salino 3 % para subir 4 a 6 mEq/L. Normalizar rápido expone a la desmielinización osmótica.', fu:[0,1]}]},
 {q:'La convulsión cedió y el Na subió a 113 mEq/L. ¿Qué tope de corrección fijas para las próximas 24 h?', o:[
  {t:'No más de 8 mEq/L en 24 h, por riesgo alto de desmielinización osmótica', ok:1, fb:'Alcoholismo, desnutrición, hipopotasemia y sodio muy bajo son factores de riesgo alto. En ese caso el tope es 8 mEq/L en 24 h.', fu:[1,2,6]},
  {t:'Hasta 12 mEq/L, como en cualquier hiponatremia crónica', fb:'Los 10 a 12 mEq/L en 24 h son el límite para riesgo estándar. Con riesgo alto, el límite es 8.', fu:[1,2]},
  {t:'Normalizarlo hasta 135 mEq/L en 12 horas con salino al 3 %', fb:'Excede cualquiera de los límites aceptados: 8 mEq/L en 24 h en riesgo alto, 10 a 12 en riesgo estándar.', fu:[1,2]}]},
 {q:'Seis horas después tuvo diuresis acuosa de 6 L. El Na está en 121 mEq/L (subió 13 desde el ingreso). ¿Qué haces?', o:[
  {t:'Desmopresina parenteral con dextrosa al 5 % para volver a bajar el sodio, con controles seriados', ok:1, fb:'Es la estrategia de rescate cuando el sodio ya se pasó del límite. En una serie, desmopresina con dextrosa dejó el sodio 4 a 9 mEq/L por debajo del pico. Las dosis descritas van de 1 a 4 µg IV o SC cada 6 a 8 h según el esquema.', fu:[2,4,5,3]},
  {t:'Observar y repetir el sodio mañana, porque está asintomático', fb:'El riesgo está en la sobrecorrección, no solo en los síntomas de hoy. Cuando se pasa el límite, está descrito volver a bajar el sodio con desmopresina y dextrosa.', fu:[2,4]},
  {t:'Tolvaptán oral para frenar la diuresis y controlar el sodio', fb:'Los vaptanes pueden causar excreción incontrolada de agua y más sobrecorrección. No se recomiendan en esta situación.', fu:[4]}]}
 ]},
{id:'anafi', n:'Anafilaxia con urticaria y estridor', c:'Dermatología',
 pres:'Mujer de 30 años que, minutos después de una dosis de amoxicilina IV en emergencia, presenta ronchas generalizadas, estridor y PA 80/45.',
 fu:[['WAO: guía de anafilaxia 2020, afiche (Cardona et al., World Allergy Organ J 2020)','https://www.worldallergy.org/media/PDFs/Anaphylaxis_Guidelines_Poster.pdf'],['Cleveland Clinic J Med 2022: parámetro de práctica AAAAI/ACAAI','https://www.ccjm.org/content/89/2/106'],['WAO Anaphylaxis Guidance 2020 (PubMed 33204386)','https://pubmed.ncbi.nlm.nih.gov/33204386/']],
 pasos:[
 {q:'¿Cuál es tu primer medicamento?', o:[
  {t:'Epinefrina IM en el muslo anterolateral, 0,01 mg/kg (máximo 0,5 mg en adultos)', ok:1, fb:'Es el tratamiento de primera línea y no debe retrasarse: la demora se asocia a más morbilidad y mortalidad. Se anota la hora de la dosis.', fu:[0,1]},
  {t:'Antihistamínico IV primero y epinefrina si no mejora', fb:'Los antihistamínicos y corticoides son de segunda línea y no reemplazan a la epinefrina en los síntomas cardiovasculares.', fu:[2,1]},
  {t:'Epinefrina IV en bolo directo, porque la hipotensión es grave', fb:'Los efectos adversos graves ocurren sobre todo con bolos IV rápidos o dosis equivocadas. La vía estándar es IM en el muslo.', fu:[0]},
  {t:'Hidrocortisona IV y observar la evolución durante una hora', fb:'Los corticoides son de segunda línea y no reemplazan a la epinefrina.', fu:[2,1]}]},
 {q:'A los 5 minutos persisten el estridor y la hipotensión. ¿Qué haces?', o:[
  {t:'Repetir epinefrina IM cada 5 a 15 min, acostarla y dar 1 a 2 L de solución isotónica', ok:1, fb:'La mayoría responde a 1 o 2 dosis. Si no, se repite cada 5 a 15 minutos. Los líquidos isotónicos están indicados cuando hay hipotensión.', fu:[0]},
  {t:'Pasar a epinefrina IV en bolo, porque la IM no funcionó', fb:'Los efectos adversos graves ocurren sobre todo con bolos IV rápidos o dosis equivocadas. Si no responde, se repite la IM cada 5 a 15 minutos.', fu:[0]},
  {t:'Esperar 30 minutos a ver si responde al antihistamínico', fb:'La epinefrina se repite cada 5 a 15 minutos si hace falta. Los antihistamínicos no sustituyen esa dosis.', fu:[0,2]}]},
 {q:'Ya se estabilizó. ¿Qué indicas antes del alta?', o:[
  {t:'Epinefrina autoinyectable, educación sobre el desencadenante y control con alergología', ok:1, fb:'Antes del alta se da la prescripción de epinefrina y se indica seguimiento para pruebas de alergia.', fu:[2,1]},
  {t:'Alta con antihistamínico oral por 3 días como único tratamiento', fb:'Antes del alta se da la prescripción de epinefrina y se indica seguimiento. El antihistamínico no reemplaza a la epinefrina.', fu:[2,1]},
  {t:'Alta sin más indicaciones, porque ya se estabilizó y no tiene síntomas', fb:'Antes del alta el paciente debe recibir receta de epinefrina y control con alergología.', fu:[2]}]}
 ]}
];
CASOS.push(
{id:'aki', n:'Lesión renal aguda prerrenal por deshidratación y AINE', c:'Nefrología',
 pres:'Mujer de 70 años con diarrea y vómitos hace 4 días. Tomó ibuprofeno para el dolor. PA 90/55, FC 110, mucosas secas. Creatinina 2,4 mg/dL (su valor basal es 1,0). Diuresis menor de 0,5 mL/kg/h durante las últimas 12 horas.',
 fu:[['KDIGO: tabla de estadios de la lesión renal aguda (Crit Care Clin 2021)','https://pmc.ncbi.nlm.nih.gov/articles/PMC8157315/table/tbl1'],['KDIGO 2012: guía de lesión renal aguda, recomendaciones 3.1.1, 3.4.1 y 3.4.2 (Kidney Int Suppl)','https://kdigo.org/wp-content/uploads/2017/04/KDIGO-AKI-Guideline_Cass-2014.pdf'],['Diuréticos en lesión renal aguda: recomendación 5.2.2 (PMC4089654)','https://pmc.ncbi.nlm.nih.gov/articles/PMC4089654']],
 pasos:[
 {q:'¿En qué estadio KDIGO (Kidney Disease: Improving Global Outcomes) de lesión renal aguda está?', o:[
  {t:'Estadio 2: creatinina 2,0 a 2,9 veces la basal y diuresis menor de 0,5 mL/kg/h por 12 h o más', ok:1, fb:'Su creatinina es 2,4 veces la basal y la oliguria lleva 12 h, lo que corresponde al estadio 2. El estadio manda sobre cuán urgente es el manejo y la vigilancia.', fu:[0]},
  {t:'Estadio 1: creatinina de 1,5 a 1,9 veces la basal y diuresis menor de 0,5 mL/kg/h por 6 a 12 h', fb:'2,4 veces la basal ya supera el rango del estadio 1.', fu:[0]},
  {t:'Estadio 3: creatinina 3 veces la basal o más, creatinina de 4,0 mg/dL o diálisis', fb:'El estadio 3 pide 3 veces la basal, creatinina de 4,0 mg/dL o más, inicio de diálisis o diuresis menor de 0,3 mL/kg/h por 24 h.', fu:[0]}]},
 {q:'Está hipovolémica y con un AINE (antiinflamatorio no esteroideo) en su historia. ¿Qué indicas primero?', o:[
  {t:'Suspender el ibuprofeno y reponer volumen con cristaloides isotónicos', ok:1, fb:'KDIGO sugiere cristaloides isotónicos en lugar de coloides (grado 2B) para la expansión inicial, y se retiran los fármacos nefrotóxicos. Aquí no hay shock hemorrágico.', fu:[1]},
  {t:'Furosemida IV en dosis alta para estimular la diuresis y proteger al riñón', fb:'KDIGO recomienda no usar diuréticos para prevenir la lesión renal aguda (1B) y sugiere no usarlos para tratarla salvo sobrecarga de volumen (2C). Aquí está deshidratada.', fu:[1,2]},
  {t:'Reponer con coloides (por ejemplo almidón) para expandir más rápido', fb:'KDIGO sugiere cristaloides isotónicos en lugar de coloides (grado 2B) cuando no hay shock hemorrágico.', fu:[1]}]},
 {q:'Tras la reposición mejora la presión, pero aparece edema de pulmón y la diuresis sigue baja. ¿Qué haces?', o:[
  {t:'Dar un diurético, porque ahora hay sobrecarga de volumen', ok:1, fb:'El diurético se reserva para tratar la sobrecarga de volumen (recomendación 3.4.2, grado 2C). No acelera la recuperación del riñón (recomendación 5.2.2, grado 2B).', fu:[1,2]},
  {t:'Seguir con cristaloides a la misma velocidad', fb:'Con edema de pulmón hay sobrecarga y seguir reponiendo empeora el cuadro.', fu:[1]},
  {t:'Dar furosemida en dosis altas para que el riñón se recupere antes', fb:'El diurético no mejora la recuperación renal. Se usa para tratar la sobrecarga, no para tratar la lesión.', fu:[2]}]}
 ]},
{id:'nefro', n:'Síndrome nefrótico por cambios mínimos en adulto joven', c:'Nefrología',
 pres:'Varón de 22 años con edema en piernas y párpados desde hace 3 semanas, espuma en la orina, proteinuria en rango nefrótico y albúmina baja. Sin hematuria, sin hipertensión, función renal normal.',
 fu:[['KDIGO: guía de glomerulopatías, enfermedad de cambios mínimos (PMC4089636)','https://pmc.ncbi.nlm.nih.gov/articles/PMC4089636'],['Korbet y Whittier: cambios mínimos en adultos (PMC6556731)','https://pmc.ncbi.nlm.nih.gov/articles/PMC6556731']],
 pasos:[
 {q:'¿Cómo confirmas la causa del síndrome nefrótico?', o:[
  {t:'Biopsia renal, porque en adultos es clave para saber la causa', ok:1, fb:'En adultos la biopsia renal es esencial. La enfermedad de cambios mínimos explica solo cerca del 10 al 25 % de los síndromes nefróticos del adulto, así que hay otras causas posibles.', fu:[1,0]},
  {t:'Empezar prednisona sin biopsia, porque seguro son cambios mínimos', fb:'En el adulto los cambios mínimos son solo una parte de las causas. Se necesita biopsia para saber qué se trata.', fu:[1]},
  {t:'Solo controlar la proteinuria y esperar', fb:'Sin diagnóstico histológico no se puede elegir el tratamiento específico.', fu:[1,0]}]},
 {q:'La biopsia confirma enfermedad de cambios mínimos. ¿Cuál es el tratamiento inicial?', o:[
  {t:'Prednisona 1 mg/kg al día (máximo 80 mg) o 2 mg/kg en días alternos (máximo 120 mg)', ok:1, fb:'Son las dosis de la guía KDIGO para el inicio. Los corticoides son la primera línea.', fu:[0,1]},
  {t:'Ciclosporina primero y dejar los corticoides para después', fb:'La primera línea son los corticoides. Los otros inmunosupresores se reservan para recaídas, dependencia o resistencia.', fu:[0]},
  {t:'Prednisona 10 mg al día por 2 semanas y control de proteinuria', fb:'Esa dosis es muy baja para inducir la remisión. La guía usa 1 mg/kg al día.', fu:[0]}]},
 {q:'¿Por cuánto tiempo mantienes la dosis plena y cómo sigues?', o:[
  {t:'Mínimo 4 semanas si hay remisión completa y máximo 16 si no, y bajar lento durante unos 6 meses', ok:1, fb:'Es el esquema de KDIGO. Entre el 5 y el 20 % de los adultos es resistente a corticoides.', fu:[0,1]},
  {t:'Suspender de golpe a las 2 semanas, cuando desaparece el edema y baja la proteinuria', fb:'Suspender temprano favorece las recaídas. La dosis plena se sostiene al menos 4 semanas tras la remisión completa.', fu:[0]},
  {t:'Dosis plena durante 6 meses completos sin reducir antes', fb:'El máximo con dosis plena es de 16 semanas si no hay remisión completa. Después se rebaja de forma gradual.', fu:[0]}]}
 ]},
{id:'pielo', n:'Pielonefritis aguda (infección urinaria complicada)', c:'Nefrología',
 pres:'Mujer de 28 años con 3 días de disuria y polaquiuria. Desde ayer fiebre de 39 °C, escalofríos, dolor lumbar derecho y vómitos. Dolor a la percusión del ángulo costovertebral. PA 110/70, FC 110.',
 fu:[['IDSA 2025: infección urinaria complicada, resumen en emDocs','https://www.emdocs.net/?p=24659'],['Sinai Health, Antimicrobial Stewardship: infecciones urinarias','https://www.sinaihealth.ca/areas-of-care/antimicrobial-stewardship/clinical-summaries/urinary-tract-infections-utis']],
 pasos:[
 {q:'¿Cómo clasificas este cuadro y qué antibiótico empírico eliges?', o:[
  {t:'Infección complicada (fiebre y dolor lumbar). Ceftriaxona 1 g IV cada 24 h', ok:1, fb:'Los signos sistémicos (fiebre, dolor en el flanco, dolor a la percusión) la hacen complicada. Las opciones empíricas son cefalosporinas de 3.ª o 4.ª generación como ceftriaxona, piperacilina-tazobactam o fluoroquinolonas.', fu:[0,1]},
  {t:'Cistitis. Nitrofurantoína 100 mg cada 12 h por 5 días', fb:'La nitrofurantoína sirve para cistitis, pero no suele alcanzar niveles adecuados en el parénquima renal ni en la sangre, y aquí hay compromiso sistémico.', fu:[1,0]},
  {t:'Cistitis. Fosfomicina 3 g por vía oral en dosis única', fb:'La fosfomicina oral en dosis única es para cistitis. En pielonefritis no se considera adecuada por las mismas razones.', fu:[1,0]}]},
 {q:'Mejora con el tratamiento. ¿Cuánto dura el esquema efectivo?', o:[
  {t:'7 días con betalactámico (5 a 7 con fluoroquinolona), desde el primer día de tratamiento efectivo', ok:1, fb:'Es la duración que señalan las guías para infección complicada con buena respuesta. Se cuenta desde el primer día de terapia activa.', fu:[0,1]},
  {t:'3 días con trimetoprima-sulfametoxazol, igual que en la cistitis', fb:'Los 3 días corresponden a cistitis no complicada con trimetoprima-sulfametoxazol. En la complicada se necesitan 5 a 7 días.', fu:[1]},
  {t:'Tratar hasta que un urocultivo de control salga negativo', fb:'La duración se fija por días de tratamiento efectivo y evolución clínica, no por repetir cultivos.', fu:[0]}]},
 {q:'Llega el urocultivo con el germen y su antibiograma. ¿Qué haces?', o:[
  {t:'Ajustar el antibiótico según el antibiograma', ok:1, fb:'El tratamiento definitivo se elige con el cultivo, para no dejar un fármaco al que el germen es resistente ni usar uno de espectro excesivo.', fu:[0]},
  {t:'Cambiar siempre a un carbapenem para cubrir cualquier resistencia', fb:'El tratamiento definitivo se dirige con el urocultivo. Ampliar el espectro sin necesidad no está indicado.', fu:[0]},
  {t:'Mantener el empírico sin mirar el resultado, porque ya mejoró', fb:'El cultivo sirve para dirigir el tratamiento definitivo. Un germen resistente puede recaer aunque haya mejoría inicial.', fu:[0]}]}
 ]},
{id:'ascitis', n:'Cirrosis con ascitis y fiebre', c:'Gastroenterología',
 pres:'Varón de 60 años con cirrosis conocida. Consulta por aumento del perímetro abdominal, dolor abdominal difuso leve y fiebre de 38 °C. Ascitis a tensión en el examen. Tomaba diclofenaco por dolor de espalda.',
 fu:[['Revisión de ascitis en cirrosis (PMC6490258)','https://pmc.ncbi.nlm.nih.gov/articles/PMC6490258']],
 pasos:[
 {q:'¿Qué haces primero con el líquido ascítico?', o:[
  {t:'Paracentesis diagnóstica con recuento celular (PMN, polimorfonucleares)', ok:1, fb:'En un paciente con ascitis y fiebre se debe tomar líquido y contar los PMN. Se pide el recuento siempre que se obtiene líquido ascítico.', fu:[0]},
  {t:'Empezar espironolactona y furosemida y esperar la respuesta clínica', fb:'Con fiebre y dolor hay que descartar infección del líquido antes de dar por sentado que es solo ascitis.', fu:[0]},
  {t:'Dar paracetamol y observar la evolución durante 24 horas', fb:'Retrasar el análisis del líquido retrasa el diagnóstico de la infección.', fu:[0]}]},
 {q:'El líquido tiene 480 PMN/mm³. ¿Cómo lo interpretas?', o:[
  {t:'Peritonitis bacteriana espontánea: más de 250 PMN es compatible', ok:1, fb:'Un recuento de más de 250 PMN en el líquido ascítico de un paciente con cirrosis es compatible con peritonitis bacteriana espontánea.', fu:[0]},
  {t:'Líquido normal, el límite de infección es 1000 PMN', fb:'El punto de corte es más de 250 PMN.', fu:[0]},
  {t:'No se puede interpretar hasta que salga el cultivo', fb:'El recuento de PMN permite sospechar la infección sin esperar el cultivo.', fu:[0]}]},
 {q:'Ya resuelta la infección, ¿cómo manejas la ascitis a largo plazo?', o:[
  {t:'Dieta baja en sodio, espironolactona más furosemida por vía oral una vez al día, y suspender el diclofenaco', ok:1, fb:'La primera línea es la dieta baja en sodio con educación, la combinación de espironolactona y furosemida por vía oral una vez al día, y retirar los AINE (antiinflamatorios no esteroideos).', fu:[0]},
  {t:'Solo restringir líquidos a 1 L al día y mantener el diclofenaco', fb:'Los AINE se retiran en la ascitis. La base es la restricción de sodio y los diuréticos.', fu:[0]},
  {t:'Paracentesis evacuadora semanal como único tratamiento, sin dieta ni diuréticos', fb:'La primera línea es la dieta baja en sodio con diuréticos. La paracentesis se reserva para la ascitis a tensión o refractaria.', fu:[0]}]}
 ]},
{id:'pancrea', n:'Pancreatitis aguda biliar', c:'Gastroenterología',
 pres:'Varón de 50 años con dolor epigástrico intenso desde hace 8 horas que se irradia a la espalda, náuseas y vómitos. Lipasa muy elevada. La ecografía abdominal muestra litiasis vesicular sin dilatación de la vía biliar. Sin fiebre ni ictericia.',
 fu:[['ACG 2024: guía de pancreatitis aguda (Am J Gastroenterol 119:419-437), resumen en Guideline Central','https://guidelinecentral.com/guideline/12896']],
 pasos:[
 {q:'¿Cómo hidratas?', o:[
  {t:'Cristaloide isotónico moderadamente agresivo, mejor Ringer lactato que suero fisiológico, y reevaluar', ok:1, fb:'La guía ACG 2024 prefiere Ringer lactato. Se ajusta con bolos si hay hipovolemia, y se reevalúa a las 6 h y durante las primeras 24 a 48 h para ver si baja el BUN (nitrógeno ureico). Hay que vigilar la sobrecarga en cardiópatas y nefrópatas.', fu:[0]},
  {t:'Restringir líquidos y mantener ayuno para reposar el páncreas', fb:'La hidratación es parte central del manejo inicial.', fu:[0]},
  {t:'Hidratación muy agresiva a velocidad fija durante 48 horas, sin reevaluar', fb:'La guía recomienda una estrategia moderadamente agresiva y reevaluar. Más volumen sin control aumenta el riesgo de sobrecarga.', fu:[0]}]},
 {q:'Con el dolor controlado, ¿cuándo y cómo lo alimentas?', o:[
  {t:'Vía oral dentro de 24 a 48 h según tolerancia, con dieta sólida baja en grasa', ok:1, fb:'La guía favorece la alimentación oral temprana y una dieta sólida baja en grasa desde el inicio, en lugar de avanzar por etapas.', fu:[0]},
  {t:'Ayuno completo hasta que la lipasa se normalice y el dolor desaparezca', fb:'No hace falta esperar la normalización de la lipasa. La alimentación oral temprana se recomienda cuando el paciente la tolera.', fu:[0]},
  {t:'Líquidos claros por varios días y luego avanzar paso a paso', fb:'La dieta sólida baja en grasa desde el inicio se prefiere frente al avance por etapas.', fu:[0]}]},
 {q:'No hay colangitis y mejora. ¿Cómo manejas la vesícula?', o:[
  {t:'Colecistectomía temprana, de preferencia antes del alta, si la pancreatitis biliar es leve', ok:1, fb:'La guía recomienda la colecistectomía precoz, de preferencia durante la misma hospitalización en la pancreatitis biliar leve. La CPRE (colangiopancreatografía retrógrada endoscópica) se reserva para colangitis, en menos de 24 h.', fu:[0]},
  {t:'CPRE urgente en todos los casos de pancreatitis biliar', fb:'Sin colangitis, la guía prefiere el manejo médico antes que una CPRE temprana a las 72 h.', fu:[0]},
  {t:'Alta y programar la cirugía para dentro de varios meses', fb:'La guía prefiere operar antes del alta en la pancreatitis biliar leve.', fu:[0]}]},

function vCaso(){
  const k = CASOS.find(x => x.id === V.caso), i = V.paso || 0, fin = i >= k.pasos.length;
  const back = '<div class="row"><button class="btn small ghost" data-act="clin">‹ Práctica clínica</button></div>';
  const src = idx => linksHtml(idx.map(j => k.fu[j]));
  const head = '<h2 class="cl-h">'+esc(k.n)+'</h2><p class="src">'+esc(k.c)+(fin ? '' : ' · decisión '+(i+1)+' de '+k.pasos.length)+'</p>';
  if(fin){
    return '<div class="stack">'+back+head+'<div class="panel cl-res"><div class="cl-big">Caso terminado</div><p>Decisiones equivocadas: '+(V.fallos||0)+'.</p><p class="src" style="margin:0">Es una simulación para estudiar con guías internacionales. En tu hospital manda el protocolo local.</p></div>'+
      '<button class="btn act" data-act="clcaso" data-id="'+k.id+'"><b>Repetir el caso</b></button><p class="src"><b>Todas las fuentes de este caso:</b></p>'+linksHtml(k.fu)+'</div>';
  }
  const p = k.pasos[i], s = V.sel;
  if(!V.ord || V.ordP !== i){ V.ord = p.o.map((_, j) => j); for(let a = V.ord.length - 1; a > 0; a--){ const b = Math.floor(Math.random() * (a + 1)); [V.ord[a], V.ord[b]] = [V.ord[b], V.ord[a]]; } V.ordP = i; }
  const ops = V.ord.map(j => { const o = p.o[j]; return '<button class="btn act cl-op'+(s === j ? (o.ok ? ' cl-ok' : ' cl-no') : '')+'" data-act="clop" data-i="'+j+'"'+(s != null ? ' disabled' : '')+'><b>'+esc(o.t)+'</b></button>'; }).join('');
  let fb = '';
  if(s != null){
    const o = p.o[s];
    fb = '<div class="panel cl-fb '+(o.ok ? 'cl-fbok' : 'cl-fbno')+'"><p style="margin:0"><b>'+(o.ok ? 'Bien.' : 'No es la mejor decisión.')+'</b> '+esc(o.fb)+'</p>'+src(o.fu)+'</div>'+
      '<button class="btn act" data-act="'+(o.ok ? 'clnext' : 'clretry')+'"><b>'+(o.ok ? (i+1 >= k.pasos.length ? 'Terminar caso' : 'Siguiente decisión') : 'Volver a decidir')+'</b></button>';
  }
  return '<div class="stack">'+back+head+(i === 0 ? '<div class="panel cl-ctx">'+esc(k.pres)+'</div>' : '')+'<p class="label">'+esc(p.q)+'</p><div class="stack" style="gap:10px">'+ops+'</div>'+fb+'</div>';
}

function errSrc(list){
  const out = [];
  list.forEach(t => { const [k, key, idx] = t.split(':'), ix = idx.split(',').map(Number);
    const base = k === 'c' ? (CASOS.find(x => x.id === key) || {}).fu : (FARM.find(x => x.n.startsWith(key)) || {}).fu;
    if(base) ix.forEach(j => { if(base[j] && !out.some(o => o[1] === base[j][1])) out.push(base[j]); }); });
  return out;
}

{n:'Proteinuria, edema o hematuria (síndrome nefrótico o nefrítico)', c:'Nefrología', ctx:'Los dos síndromes se pueden superponer. Si hay proteinuria en rango nefrótico, es nefrótico; si hay lesión inflamatoria glomerular, es nefrítico.',

const lRi = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const lR = (a, b) => a + Math.random() * (b - a);
const lPick = a => a[lRi(0, a.length - 1)];
const lc = (n, d) => fx(n, d).replace('.', ',');
const LEC_FU = {
  abg: [['Interpretación de gasometría arterial (StatPearls)', 'https://dev2.statpearls.com/articlelibrary/viewarticle/17837'], ['Seis pasos para la gasometría (Lippincott Nursing Center)', 'https://nursingcenter.com/clinical-resources/nursing-pocket-cards/arterial-blood-gas'], ['Brecha aniónica (revisión MDCalc)', 'https://mdcalc.scholasticahq.com/article/154676-updated-review-of-serum-anion-gap']],
  aki: [['KDIGO 2012 de lesión renal aguda: estadios (QxMD)', 'https://qxmd.com/calculate/definition_17/kdigo-aki-staging'], ['Estadios KDIGO (Crit Care Clin 2021)', 'https://pmc.ncbi.nlm.nih.gov/articles/PMC8157315/table/tbl1'], ['KDIGO 2012, definición y estadios (Kidney Int Suppl)', 'https://qxmd.com/calculate/reference_book_10/kdigo-clinical-practice-guideline-for-acute-kidney-injury?embed=1']],
  hep: [['Guía ACG sobre lesión hepática por fármacos (resumen MDCalc)', 'https://www.mdcalc.com/guidelines/509/acg/diagnosis-management-idiosyncratic-drug-induced-liver-injury'], ['AASLD 2022: lesión hepática por fármacos (Guideline Central)', 'https://guidelinecentral.com/guideline/1986837']],
  child: [['Child-Pugh, tabla de puntos (World J Gastroenterol 2014)', 'https://pmc.ncbi.nlm.nih.gov/articles/PMC4202351/table/T1'], ['Child-Pugh, tabla (BMC Nephrol 2018)', 'https://pmc.ncbi.nlm.nih.gov/articles/PMC5899361/table/Tab1']]
};
const LEC = [
{id:'abg', n:'Gasometría y brecha aniónica', ctx:'Lee el pH, la PaCO2 y el bicarbonato para nombrar el trastorno primario. Rangos normales usados: pH 7,35 a 7,45; PaCO2 35 a 45 mmHg; HCO3 22 a 26 mEq/L; brecha aniónica 8 a 12 mEq/L.',
  gen(){
    const lab = {agalto:'Acidosis metabólica con brecha aniónica alta', agnormal:'Acidosis metabólica con brecha aniónica normal', alcmet:'Alcalosis metabólica', acresp:'Acidosis respiratoria', alcresp:'Alcalosis respiratoria'};
    const cls = (ph, pc, hc, ag) => ph < 7.35 ? (hc < 22 ? (ag > 12 ? 'agalto' : 'agnormal') : pc > 45 ? 'acresp' : '?') : ph > 7.45 ? (hc > 26 ? 'alcmet' : pc < 35 ? 'alcresp' : '?') : '?';
    for(;;){
      const t = lPick(Object.keys(lab)), na = lRi(136, 142);
      let ph, pc, hc, ag = lRi(8, 12);
      if(t === 'agalto'){ hc = lRi(7, 15); ph = lR(7.12, 7.31); pc = Math.round(1.5 * hc + 8 + lR(-2, 2)); ag = lRi(18, 28); }
      else if(t === 'agnormal'){ hc = lRi(10, 17); ph = lR(7.20, 7.33); pc = Math.round(1.5 * hc + 8 + lR(-2, 2)); }
      else if(t === 'alcmet'){ hc = lRi(31, 40); ph = lR(7.47, 7.58); pc = lRi(46, 56); }
      else if(t === 'acresp'){ hc = lRi(26, 32); ph = lR(7.18, 7.32); pc = lRi(52, 80); }
      else { hc = lRi(18, 22); ph = lR(7.48, 7.58); pc = lRi(20, 30); }
      ph = Math.round(ph * 100) / 100;
      const cl = na - hc - ag;
      if(cls(ph, pc, hc, ag) !== t) continue;
      const why = {
        agalto: 'pH bajo con bicarbonato bajo: acidosis metabólica. Brecha aniónica = Na − Cl − HCO3 = '+na+' − '+cl+' − '+hc+' = '+ag+' (normal 8 a 12), así que la brecha está elevada: hay un ácido que el laboratorio no mide (lactato, cetonas, uremia, tóxicos). La PaCO2 baja es la compensación respiratoria.',
        agnormal: 'pH bajo con bicarbonato bajo: acidosis metabólica. Brecha aniónica = '+na+' − '+cl+' − '+hc+' = '+ag+', normal. Es una acidosis hiperclorémica: pérdida de bicarbonato (diarrea) o acidosis tubular renal. La PaCO2 baja es la compensación.',
        alcmet: 'pH alto con bicarbonato alto: alcalosis metabólica. La PaCO2 sube un poco porque el pulmón compensa hipoventilando.',
        acresp: 'pH bajo con PaCO2 alta: acidosis respiratoria, por hipoventilación. El bicarbonato elevado es la compensación renal.',
        alcresp: 'pH alto con PaCO2 baja: alcalosis respiratoria, por hiperventilación. El bicarbonato algo bajo es la compensación.'
      }[t];
      return {
        txt: 'Gasometría arterial: pH '+lc(ph, 2)+'; PaCO2 '+pc+' mmHg; HCO3 '+hc+' mEq/L. Química: Na '+na+', Cl '+cl+' mEq/L; albúmina 4,0 g/dL (no hace falta corregir la brecha).',
        q: '¿Cuál es el trastorno primario?', o: Object.keys(lab).map(k => ({k, t: lab[k], ok: k === t})), why, fu: LEC_FU.abg
      };
    }
  }},
{id:'aki', n:'Lesión renal aguda: estadio KDIGO', ctx:'KDIGO define la lesión renal aguda (LRA) por el aumento de creatinina y la estadifica de 1 a 3. Aquí se usa solo la creatinina (sin diuresis). Estadio 1: 1,5 a 1,9 veces la basal o aumento de 0,3 mg/dL en 48 h; estadio 2: 2,0 a 2,9 veces; estadio 3: 3 veces o más, creatinina de 4,0 o más, o diálisis.',
  gen(){
    const B = lRi(7, 12), c = lRi(0, 3);
    let C;
    if(c === 0) C = B + lRi(1, 2);
    else if(c === 1) C = Math.random() < 0.5 ? Math.round(B * lR(1.55, 1.85)) : B + lRi(3, 4);
    else if(c === 2) C = Math.round(B * lR(2.05, 2.85));
    else C = Math.round(B * lR(3.05, 4.2));
    const st = C * 10 >= B * 30 || C >= 40 ? 3 : C * 10 >= B * 20 ? 2 : (C * 10 >= B * 15 || C - B >= 3) ? 1 : 0;
    const razon = C / B, aum = (C - B) / 10;
    const why = 'Cociente: '+lc(razon, 2)+' veces la basal; aumento de '+lc(aum, 1)+' mg/dL en 48 h. ' + ['No cumple: el aumento es menor de 0,3 mg/dL y el cociente menor de 1,5.', 'Estadio 1: 1,5 a 1,9 veces la basal, o un aumento de 0,3 mg/dL o más en 48 h.', 'Estadio 2: 2,0 a 2,9 veces la basal.', 'Estadio 3: 3 veces la basal o más, o creatinina de 4,0 mg/dL o más.'][st];
    return {
      txt: 'Hace 48 horas su creatinina era '+lc(B / 10, 1)+' mg/dL. Hoy es '+lc(C / 10, 1)+' mg/dL. No hay datos de diuresis.',
      q: '¿Qué categoría KDIGO corresponde?', o: [['No cumple criterios de LRA', 0], ['LRA estadio 1', 1], ['LRA estadio 2', 2], ['LRA estadio 3', 3]].map(a => ({t: a[0], ok: a[1] === st})), ord: true, why, fu: LEC_FU.aki
    };
  }},
{id:'hep', n:'Patrón hepático: cociente R', ctx:'El cociente R separa la lesión hepatocelular de la colestásica según qué enzima sube más respecto a su límite superior normal (LSN). Se usa sobre todo en la lesión hepática por fármacos. R = (ALT ÷ LSN de ALT) ÷ (FA ÷ LSN de FA). R de 5 o más: hepatocelular; de 2 a 5: mixto; menor de 2: colestásico.',
  gen(){
    for(;;){
      const t = lPick(['hepatocelular', 'colestásico', 'mixto']);
      let alt, fa;
      if(t === 'hepatocelular'){ alt = lRi(200, 1500); fa = lRi(100, 260); }
      else if(t === 'colestásico'){ alt = lRi(50, 260); fa = lRi(400, 1300); }
      else { alt = lRi(150, 450); fa = lRi(250, 560); }
      const R = (alt / 40) / (fa / 120);
      const cl = R >= 5 ? 'hepatocelular' : R <= 2 ? 'colestásico' : 'mixto';
      if(cl !== t || Math.abs(R - 5) < 0.6 || Math.abs(R - 2) < 0.3) continue;
      return {
        txt: 'Hepatograma: ALT '+alt+' U/L (LSN 40); fosfatasa alcalina (FA) '+fa+' U/L (LSN 120).',
        q: '¿Qué patrón de lesión es?', o: ['hepatocelular', 'colestásico', 'mixto'].map(k => ({t: 'Patrón ' + k, ok: k === t})), ord: true,
        why: 'R = ('+alt+' ÷ 40) ÷ ('+fa+' ÷ 120) = '+lc(alt / 40, 1)+' ÷ '+lc(fa / 120, 1)+' = '+lc(R, 1)+'. ' + (t === 'hepatocelular' ? 'R de 5 o más: hepatocelular.' : t === 'colestásico' ? 'R menor de 2: colestásico.' : 'R entre 2 y 5: mixto.'), fu: LEC_FU.hep
      };
    }
  }},
{id:'child', n:'Child-Pugh desde los datos', ctx:'Suma de 5 variables (1 a 3 puntos cada una) que clasifica la cirrosis: A de 5 a 6 puntos, B de 7 a 9, C de 10 a 15. Sirve para pronóstico y para decidir fármacos o cirugía.',
  gen(){
    const p = [0, 0, 0, 0, 0].map(() => lRi(1, 3));
    const bili = [lR(0.5, 1.8), lR(2.2, 2.8), lR(3.4, 9)][p[0] - 1], alb = [lR(3.6, 4.5), lR(2.9, 3.4), lR(1.8, 2.6)][p[1] - 1], inr = [lR(1.0, 1.6), lR(1.8, 2.2), lR(2.4, 3.2)][p[2] - 1];
    const asc = ['sin ascitis', 'ascitis leve o controlada con diuréticos', 'ascitis moderada a grave o refractaria'][p[3] - 1], enc = ['sin encefalopatía', 'encefalopatía grado 1 a 2', 'encefalopatía grado 3 a 4'][p[4] - 1];
    const tot = p.reduce((a, b) => a + b, 0), c = tot <= 6 ? 'A' : tot <= 9 ? 'B' : 'C';
    return {
      txt: 'Bilirrubina total '+lc(bili, 1)+' mg/dL; albúmina '+lc(alb, 1)+' g/dL; INR '+lc(inr, 1)+'; '+asc+'; '+enc+'.',
      q: '¿Qué clase Child-Pugh tiene?', o: ['A', 'B', 'C'].map(k => ({t: 'Child-Pugh ' + k, ok: k === c})), ord: true,
      why: 'Puntos: bilirrubina '+p[0]+', albúmina '+p[1]+', INR '+p[2]+', ascitis '+p[3]+', encefalopatía '+p[4]+'. Total '+tot+' = clase '+c+' (A 5 a 6, B 7 a 9, C 10 a 15).', fu: LEC_FU.child
    };
  }}
];
function vLec(){
  const L = V.lec, back = '<div class="row"><button class="btn small ghost" data-act="'+(L.k ? 'cllecm' : 'clin')+'">‹ '+(L.k ? 'Lectura de datos' : 'Práctica clínica')+'</button></div>';
  if(!L.k){
    return '<div class="stack">'+back+clChips()+'<header><h2 class="cl-h">LECTURA DE DATOS</h2><p class="sub">Valores al azar de laboratorio: tú los interpretas y la app te dice el porqué. Cada ejercicio cita la guía o el criterio que usa. No toca tu progreso.</p></header>'+
      '<div class="cl-list">'+lecL().map(x => '<button class="btn act" data-act="cllecn" data-k="'+x.id+'"><b>'+esc(x.n)+'</b></button>').join('')+'</div>'+(lecL().length ? '' : '<p class="src">Aún no hay ejercicios de lectura de datos para este curso. Elige otro curso o Todos.</p>')+
      (L.tot ? '<p class="src">Esta sesión: '+L.ok+' aciertos de '+L.tot+'.</p>' : '')+'</div>';

function debData(){

    const k = q.area+'|'+q.tema, r = m[k] || (m[k] = {a:q.area, t:q.tema, n:0, vistas:0, fall:[], nuevas:[], dom:0});

  nivel: d => { const t = temasOf(d.a)[+d.i]; if(!t || !nodeOpen(d.a, +d.i)) return; const ids = nivelIds(d.a, t); startRound(ids, 'practica'); if(V.name === 'play') V.nivel = {a:d.a, t}; },
  jefe: d => { const t = temasOf(d.a)[+d.i]; if(!t || !bossOk(d.a, t) || starsOf(d.a, t) < 2) return; sfx('boss'); const ids = jefeIds(d.a, t); startRound(ids, 'boss'); if(V.name === 'play') V.jefe = {a:d.a, t}; render(); },
  tienda: () => go({name:'tienda', tab:'hat'}),
  tab: d => { V.tab = d.v; render(); },
  buy: d => {
    const it = ITEMS.find(i => i.id === d.id); if(!it || S.owned[it.id]) return;
    if(S.coins < it.p){ toast('Te faltan '+(it.p - S.coins)+' monedas'); return; }
    S.coins -= it.p; S.owned[it.id] = 1; S.cnt.buys = (S.cnt.buys || 0) + 1;
    if(it.th) S.set.theme = it.id2; else S.worn[it.slot] = it.id;
    save(); applyTheme(); sfx('buy'); buzz(30); checkAch(); render(); burstAt(document.querySelector('.shopcat .pv'), 'coin');
  },
  wear: d => {
    const it = ITEMS.find(i => i.id === d.id); if(!it || !S.owned[it.id]) return;
    if(it.th) S.set.theme = it.id2; else if(S.worn[it.slot] === it.id) delete S.worn[it.slot]; else S.worn[it.slot] = it.id;
    save(); applyTheme(); sfx('click'); render();
  },
  unwearall: () => { S.worn = {}; save(); render(); },
  qclaim: d => { ensureQuests(); const q = S.quests.list[+d.i]; if(!q || q.c || q.p < q.g) return; q.c = true; addCoins(q.r); S.cnt.qdone = (S.cnt.qdone || 0) + 1; save(); burstAt(document.querySelector('[data-act=qclaim][data-i="'+d.i+'"]'), 'coin'); checkAch(); render(); },
  qchest: () => { ensureQuests(); if(S.quests.chest || !S.quests.list.every(q => q.c)) return; S.quests.chest = true; const l = lootRoll(true); save(); openChest(l, 'COFRE DEL DÍA'); },
  resultchest: () => { if(V.loot && !V.lootOpened){ V.lootOpened = true; const l = V.loot; openChest(l, 'COFRE DE LA RONDA'); const b = document.querySelector('[data-act=resultchest]'); if(b) b.outerHTML = '<p class="src">Cofre abierto: '+esc(l.tx)+'</p>'; } },
  set: d => { if(d.k === 'theme' && !ownsTheme(d.v)){ toast('Se compra en la tienda'); return; } S.set[d.k] = d.k === 'newc' ? Number(d.v) : (d.v === '1' ? true : d.v === '0' ? false : d.v); save(); applyTheme(); render(); if(d.k === 'snd' && S.set.snd) sfx('ok'); },
  testsnd: () => { const w = S.set.snd; S.set.snd = true; sfx('lvl'); buzz(60); S.set.snd = w; },
  sndtog: d => { S.set.snd = !S.set.snd; save(); const b = document.querySelector('.sndbtn'); if(b) b.classList.toggle('off', !S.set.snd); if(S.set.snd) sfx('ok'); },
  import: () => go({name:'import'}),
  copybk: () => { const t = document.getElementById('bk'); t.select(); try{ navigator.clipboard.writeText(t.value).then(() => toast('Código copiado'), () => toast('Selecciona el texto y cópialo a mano')); }catch(e){ toast('Selecciona el texto y cópialo a mano'); } },
  restore: () => {
    try{ const o = JSON.parse(document.getElementById('bkin').value); if(typeof o.xp !== 'number' || !o.q) throw 0; S = norm(o); save(); applyTheme(); toast('Progreso restaurado'); go({name:'home'}); }
    catch(e){ toast('Ese código no es válido'); }
  },
  doimport: () => {
    try{
      const o = JSON.parse(document.getElementById('imp').value); let np = 0, nt = 0;
      const clean = s => String(s).replace(/[^\w-]/g, '_');
      (o.preguntas || []).forEach(q => {
        if(!q.id || !q.enunciado || !AREAS.some(a => a.id === q.area)) return;
        if(q.tipo === 'rc'){ if(!Array.isArray(q.puntos) || !q.puntos.length || !(q.pts > 0)) return; }
        else if(!Array.isArray(q.opciones) || q.opciones.length < 2 || !Number.isInteger(q.correcta) || !q.opciones[q.correcta]) return;
        q.id = clean(q.id); q.tema = q.tema || 'General';
        S.custom.preguntas = S.custom.preguntas.filter(x => x.id !== q.id).concat([q]); np++;
      });
      (o.tarjetas || []).forEach(c => {
        if(!c.id || !c.f || !c.b || !AREAS.some(a => a.id === c.area)) return;
        c.id = clean(c.id); c.tema = c.tema || 'General';
        S.custom.tarjetas = S.custom.tarjetas.filter(x => x.id !== c.id).concat([c]); nt++;
      });
      save(); toast(np + ' preguntas y ' + nt + ' tarjetas cargadas'); if(np + nt) go({name:'home'});
    }catch(e){ toast('El JSON no es válido'); }
  }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if(!t || t.disabled) return;
  if(!t.classList.contains('opt') && !t.classList.contains('pt') && t.dataset.act !== 'sndtog') sfx('click');
  if(AC && AC.state === 'suspended' && S.set.mus) AC.resume();
  if(V.name === 'clin' && !(V.farm || V.err || V.dx || V.lec || V.deb || V.scn || V.caso || V.calc) && ['clfarm','clerr','cldx','cllec','cldeb','clsim','cllib','clcaso','clcalc'].includes(t.dataset.act)) CLY = window.scrollY;
  const f = A[t.dataset.act]; if(f) f(t.dataset);
});
document.addEventListener('change', e => { if(e.target.id === 'nm'){ S.set.name = e.target.value.trim().slice(0, 18); save(); } });
document.addEventListener('keydown', e => {
  if(e.target.tagName === 'TEXTAREA'){ if(e.target.id === 'crtxt' && (e.ctrlKey || e.metaKey) && e.key === 'Enter'){ e.preventDefault(); A.flip(); } return; }
  if(V.name === 'play'){
    const i = '1234'.indexOf(e.key) >= 0 && e.key ? '1234'.indexOf(e.key) : 'abcd'.indexOf(e.key.toLowerCase());
    if(!V.answered && i >= 0 && e.key.length === 1) pick(i);
    else if(V.answered && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); next(); }
  } else if(V.name === 'cards' && V.queue[V.i]){
    if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); if(!V.flipped) A.flip(); }
    else if(V.flipped && '1234'.includes(e.key) && e.key.length === 1) rate(['again','hard','good','easy']['1234'.indexOf(e.key)]);
  }
});
/* ---------- carga de preguntas desde datos/ y service worker ---------- */
async function cargarDatos(){
  try{
    const m = await (await fetch('datos/manifest.json', {cache:'no-cache'})).json();
    const ps = [], ts = [];
    for(const f of (m.archivos || [])){
      const d = await (await fetch('datos/' + f, {cache:'no-cache'})).json();
      ps.push(...(d.preguntas || [])); ts.push(...(d.tarjetas || []));
    }
    if(ps.length || ts.length){ BANCO.preguntas = ps; BANCO.tarjetas = ts; }
  }catch(e){ errorCarga = true; }
  cargando = false; if(V.name === 'home') render();
}
applyTheme();
render();
cargarDatos();
showTitle();
if('serviceWorker' in navigator){ window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }
})();
</script>
